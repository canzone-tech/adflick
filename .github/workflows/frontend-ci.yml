name: Frontend CI
on:
  push:
    branches: [dev/local-foundation]
  pull_request:
    branches: [dev/local-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Production frontend install, quality gates and compiled route smoke
        run: npm run verify:frontend
      - name: Browser UAT through isolated compiled API and web plus fresh MySQL
        env:
          ADFLICK_BROWSER_UAT: "1"
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/uat-stable-clock.mjs
        run: npm run local:uat
      - name: Persistent MySQL development first-admin real-browser UAT
        env:
          ADFLICK_LOCAL_DEV_CI: "1"
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/uat-stable-clock.mjs
        run: npm run local:dev:uat
      - name: Upload real-browser UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adflick-browser-uat
          path: .adflick-uat/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

name: Backend CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: adflick_playout
          MYSQL_USER: adflick_app
          MYSQL_PASSWORD: ci_app_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://adflick_app:ci_app_password@127.0.0.1:3306/adflick_playout
      JWT_ACCESS_SECRET: ci-only-access-secret-32-characters-minimum
      JWT_REFRESH_SECRET: ci-only-refresh-secret-32-characters-minimum
      WEB_ORIGIN: http://localhost:3000
      SCHEDULER_ENABLED: "false"
      RUN_MYSQL_SECURITY_E2E: "1"
      RUN_MYSQL_FINANCE_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Full backend verification (includes database migrations and compiled runtime)
        run: npm run verify:backend

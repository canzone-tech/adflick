name: Bootstrap reviewed npm lockfile
on:
  push:
    branches: [dev/local-foundation]
    paths:
      - .github/workflows/bootstrap-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: adflick-lockfile-bootstrap
  cancel-in-progress: false
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Assert exact branch and no existing lockfile
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/dev/local-foundation"
          test ! -f package-lock.json
      - name: Resolve npm workspaces without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check lockfile structure and dependency manifests
        shell: bash
        run: |
          npm run verify:dependencies
          npm run verify:clean-release
          node -e "const l=require('./package-lock.json'); for(const w of require('./package.json').workspaces){ if(!l.packages[w]) throw Error('Missing workspace lock entry: '+w)} console.log('Lockfile workspace entries verified');"
      - name: Commit only reviewed dependency resolution output
        shell: bash
        run: |
          test "$(git status --porcelain | grep -c '^?? package-lock.json$')" -eq 1
          git add -- package-lock.json
          git diff --cached --name-only | grep -x '^package-lock.json$'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: commit npm workspace lockfile resolved on Node 24"
          git push origin HEAD:refs/heads/dev/local-foundation

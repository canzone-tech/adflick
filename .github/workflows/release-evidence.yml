name: Release Evidence
on:
  push:
    branches: [dev/local-foundation]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require exact-SHA Backend CI and Frontend CI success
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            const wanted = ['Backend CI', 'Frontend CI'];
            const sha = process.env.RELEASE_SHA;
            const { owner, repo } = context.repo;
            let latest = {};
            for (let attempt = 0; attempt < 65; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: sha, per_page: 100
              });
              latest = {};
              for (const run of data.workflow_runs) {
                if (!wanted.includes(run.name) || run.head_sha !== sha) continue;
                if (!latest[run.name] || latest[run.name].run_attempt < run.run_attempt) latest[run.name] = run;
              }
              // Never wait for the polling deadline after a required gate has failed.
              const failed = wanted.find(name => latest[name]?.status === 'completed'
                && latest[name]?.conclusion !== 'success');
              if (failed) {
                core.setFailed(failed + ' failed on exact SHA ' + sha +
                  ' (run: ' + latest[failed].html_url + '); release remains blocked.');
                return;
              }
              if (wanted.every(name => latest[name]?.status === 'completed')) break;
              if (attempt === 64) {
                core.setFailed('Timed out waiting for exact-SHA Backend CI and Frontend CI; release remains blocked.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            for (const name of wanted) {
              const run = latest[name];
              if (!run || run.head_sha !== sha || run.status !== 'completed' || run.conclusion !== 'success') {
                core.setFailed(name + ' not SUCCESS on ' + sha + '; status=' + (run?.status ?? 'missing') + ', conclusion=' + (run?.conclusion ?? 'missing'));
                return;
              }
            }
            const output = {
              project: 'ADFLICK',
              commit_sha: sha,
              backend: { run_id: latest['Backend CI'].id, url: latest['Backend CI'].html_url, result: 'PASS' },
              frontend: { run_id: latest['Frontend CI'].id, url: latest['Frontend CI'].html_url, result: 'PASS' },
              release_evidence: 'EXACT_SHA_VERIFIED',
              production_approval: 'PENDING',
              production_deployment: 'NOT_AUTHORIZED'
            };
            fs.writeFileSync('release-evidence.json', JSON.stringify(output, null, 2) + '\n');
            core.info('Exact SHA evidence: ' + sha);
      - name: Publish release evidence (not a deploy approval)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adflick-release-evidence
          path: release-evidence.json
          retention-days: 30
